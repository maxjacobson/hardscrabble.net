name: CI

on: [push]

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 1 # Increment this number if you need to re-download cached gems
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: corepack npm ci
      - name: Cache opengraph images
        id: cache-opengraph-images
        uses: actions/cache@v6
        with:
          path: tmp
          key: ${{ runner.os }}-tmp
      - name: Setup imagemagick
        run: |
          sudo apt-get install -y libfuse2 gsfonts
          sudo wget --quiet https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-31/ImageMagick-7.1.2-31-gcc-x86_64.AppImage -O /usr/local/bin/magick
          sudo chmod +x /usr/local/bin/magick
          magick -version
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: |
          magick -list font
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          OPENGRAPH_FONT: "Nimbus-Sans-Regular"
      - run: bin/lint

